<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <title>Karta Gracza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player-card">
    <header class="card-header">
        <h1>🎮 Karta Gracza</h1>
        <p>Nick: <span class="highlight">GamerOnline23</span></p>
      </header>
      <section class="card-section bio">
        <h2>📋 Bio</h2>
        <p>Poziom: <strong>71</strong></p>
        <p>Klasa: <strong>Wojownik psów</strong></p>
        <p>Gildia: <strong>Wojownicy Minecrafta</strong></p>
      </section>
      <section class="card-section equipment">
        <h2>⚔️ Ekwipunek</h2>
        <ul>
          <li>Smycz dla psa +5</li>
          <li>Pies Siły</li>
          <li>Smakołyki ochrony</li>
        </ul>
      </section>
      <section class="card-section achievements">
        <h2>🏆 Osiągnięcia</h2>
        <ul>
          <li>Pogromca Smoków</li>
          <li>Mistrz Oswajania</li>
          <li>Pierwsze 1000 punktów</li>
        </ul>
      </section>

      <footer class="card-footer">
        <p>
          Ostatnia aktywność: <time datetime="2026-08-29">29 sierpnia 2026</time>
        </p>
      </footer>



    <!-- TODO: dodaj sekcje karty gracza -->
  </main>

</html>
